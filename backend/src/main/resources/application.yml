server:
  port: ${PORT:8081}
  http2:
    enabled: true
  tomcat:
    max-swallow-size: 20MB
    max-http-form-post-size: 20MB
    keep-alive-timeout: 60000
    max-connections: 1000
    max-threads: 200
    min-spare-threads: 20
  max-http-header-size: 20MB

spring:
  application:
    name: stageway-backend
  main:
    banner-mode: "off"
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    admin-emails: ${APP_SECURITY_ADMIN_EMAILS:}
    allow-self-upgrade: false
  qr:
    secret: ${QR_SECRET}
    ttl: PT48H

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
