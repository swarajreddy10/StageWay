server:
  port: ${PORT:8081}

spring:
  application:
    name: event-management-backend
  main:
    banner-mode: "off"
  
  # PostgreSQL Development Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eventmanagement}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Auto-scaling configuration for development
      minimum-idle: 5
      maximum-pool-size: 50
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
      validation-timeout: 3000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  security:
    admin-emails: ${APP_SECURITY_ADMIN_EMAILS:admin@example.com}
    allow-self-upgrade: true
  qr:
    secret: ${QR_SECRET:myQRSecretKeyThatIsAtLeast32CharactersLong}
    ttl: PT48H

# Supabase Configuration
supabase:
  url: ${SUPABASE_URL:https://demo.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:demo-anon-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:demo-service-key}
  jwt-secret: ${SUPABASE_JWT_SECRET:demo-jwt-secret}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:demo-bucket}

# Logging Configuration
logging:
  level:
    root: INFO
    com.eventmanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,hikaricp
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true