server:
  port: ${PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1200000}
      connection-test-query: SELECT 1
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  storage:
    allow-local-fallback: ${APP_STORAGE_ALLOW_LOCAL_FALLBACK:false}

logging:
  level:
    root: INFO
    com.eventmanagement: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
