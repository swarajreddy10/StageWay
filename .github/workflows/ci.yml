name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build backend
        run: |
          mvn -s .github/maven-settings.xml -f backend/pom.xml -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun ci
        working-directory: frontend
      - name: Verify frontend (lint + typecheck)
        run: bun run verify
        working-directory: frontend
      - name: Run frontend tests
        run: bun test
        working-directory: frontend
      - name: Build frontend
        run: bun run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8081

  frontend-security:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun ci
        working-directory: frontend
      - name: Audit frontend dependencies
        run: bun run security:audit
        working-directory: frontend
